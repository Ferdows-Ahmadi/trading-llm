[project]
name = "trading-analyst-api"
version = "0.1.0"
description = "FastAPI backend for trading analysis platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "psycopg[binary]>=3.2.3,<4.0.0",
  "httpx>=0.27.2,<1.0.0",
  "ccxt>=4.4.37,<5.0.0",
  "pandas>=2.2.3,<3.0.0",
  "numpy>=2.1.2,<3.0.0",
  "duckdb>=1.1.3,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.8.0,<1.0.0",
  "black>=24.10.0,<25.0.0",
  "mypy>=1.13.0,<2.0.0"
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "S", "C4"]
ignore = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
