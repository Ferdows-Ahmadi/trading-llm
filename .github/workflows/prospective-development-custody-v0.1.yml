name: Prospective Development Custody v0.1

# Execute the preregistered keyset-pagination recovery; scientific rules are unchanged.
on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/prospective-development-custody-v0.1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL_COMMIT: 1562a16f835f1b75f878341146fa7a867f2439e5
  PAGINATION_AMENDMENT_COMMIT: e1f2570c9f0f342d41426c411fc8c8bbeafd8bc1

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install Prediction Lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Verify frozen prospective custody contract before live query
        run: |
          test "$GITHUB_REF_NAME" = "research/prediction-market-lab-v0.1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PROTOCOL_COMMIT" "$GITHUB_SHA"
          git merge-base --is-ancestor "$PAGINATION_AMENDMENT_COMMIT" "$GITHUB_SHA"
          python - <<'PY'
          import os
          from prediction_lab import prospective_polymarket_custody_keyset as keyset

          assert keyset.PAGINATION_AMENDMENT_COMMIT == os.environ["PAGINATION_AMENDMENT_COMMIT"]
          PY
          pytest -q \
            packages/prediction-lab/tests/test_prospective_polymarket_custody.py \
            packages/prediction-lab/tests/test_prospective_polymarket_custody_keyset.py
          ruff check \
            packages/prediction-lab/src/prediction_lab/prospective_polymarket_custody.py \
            packages/prediction-lab/src/prediction_lab/prospective_polymarket_custody_keyset.py \
            packages/prediction-lab/tests/test_prospective_polymarket_custody.py \
            packages/prediction-lab/tests/test_prospective_polymarket_custody_keyset.py

      - name: Acquire and freeze one-time prospective market custody
        run: |
          python -m prediction_lab.prospective_polymarket_custody_keyset \
            "$RUNNER_TEMP/prospective-development-custody-v0.1" \
            --code-commit "$GITHUB_SHA"

      - name: Verify frozen custody accounting without printing questions or prices
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "prospective-development-custody-v0.1"
          summary = json.loads((root / "custody-summary.json").read_text())
          rows = [
              json.loads(line)
              for line in (root / "cohort.jsonl").read_text().splitlines()
              if line.strip()
          ]
          ledger = [
              json.loads(line)
              for line in (root / "selection-ledger.jsonl").read_text().splitlines()
              if line.strip()
          ]
          assert summary["protocol_commit"] == os.environ["PROTOCOL_COMMIT"]
          assert summary["pagination_amendment_commit"] == os.environ["PAGINATION_AMENDMENT_COMMIT"]
          assert summary["pagination_mode"] == "gamma-markets-keyset-after_cursor"
          assert summary["code_commit"] == os.environ["GITHUB_SHA"]
          assert summary["selected_rows"] == len(rows)
          assert summary["selected_event_groups"] == len({row["event_id"] for row in rows})
          assert summary["selected_rows"] <= 100
          assert len({row["market_id"] for row in rows}) == len(rows)
          assert len({row["event_id"] for row in rows}) == len(rows)
          assert len(ledger) == summary["universe_rows"]
          assert summary["forecaster_run"] is False
          assert summary["model_score_computed"] is False
          assert summary["reserved_holdout_accessed"] is False
          print("custody_rows:", summary["selected_rows"])
          print("custody_event_groups:", summary["selected_event_groups"])
          print(
              "adequate_for_forecaster_preregistration:",
              summary["custody_adequate_for_forecaster_preregistration"],
          )
          print("cohort_sha256:", summary["cohort_sha256"])
          print("universe_sha256:", summary["universe_sha256"])
          PY

      - name: Upload immutable prospective custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospective-development-custody-v0.1
          path: ${{ runner.temp }}/prospective-development-custody-v0.1/
          if-no-files-found: error
          retention-days: 90
