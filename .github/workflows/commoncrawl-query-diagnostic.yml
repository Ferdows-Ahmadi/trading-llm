name: Common Crawl Query Diagnostic

on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/commoncrawl-query-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe exact failing article across eligible crawl collections
        shell: bash
        run: |
          set -u
          ua='trading-prediction-lab/0.1 diagnostic; contact via github.com/Ferdows-Ahmadi/trading-llm'
          article='econotimes.com/FxWirePro-Key-Crypto-Updates-1736846'

          probe() {
            collection="$1"
            url_value="$2"
            match_value="${3:-}"
            endpoint="https://index.commoncrawl.org/${collection}-index"
            echo "=== ${collection} | ${url_value} | match=${match_value:-default} ==="
            args=(--silent --show-error --max-time 35 --get --user-agent "$ua" --data-urlencode "url=${url_value}" --data-urlencode 'output=json' --data-urlencode 'limit=3')
            if [ -n "$match_value" ]; then
              args+=(--data-urlencode "matchType=${match_value}")
            fi
            tmp=$(mktemp)
            status=$(curl "${args[@]}" --output "$tmp" --write-out '%{http_code}' "$endpoint" || true)
            echo "HTTP ${status}"
            head -c 1000 "$tmp" || true
            echo
            rm -f "$tmp"
            sleep 5
          }

          probe 'CC-MAIN-2026-12' 'commoncrawl.org/faq' ''
          probe 'CC-MAIN-2026-12' "$article" 'exact'
          probe 'CC-MAIN-2026-08' "$article" 'exact'
          probe 'CC-MAIN-2026-08' 'commoncrawl.org/faq' ''
