name: Wayback Capture Index Sweep v0.3

on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/wayback-capture-index-v0.3.yml
      - packages/prediction-lab/src/prediction_lab/wayback_capture_client.py
      - packages/prediction-lab/src/prediction_lab/wayback_capture_cli.py
      - packages/prediction-lab/src/prediction_lab/evidence_capture_stage.py
      - packages/prediction-lab/tests/test_wayback_capture_client.py
      - packages/prediction-lab/pyproject.toml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  capture-index:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install prediction lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Download frozen clean Polymarket benchmark
        uses: actions/download-artifact@v4
        with:
          name: polymarket-public-benchmark-v0.1-clean
          path: benchmark
          github-token: ${{ github.token }}
          repository: Ferdows-Ahmadi/trading-llm
          run-id: 34467576128

      - name: Download frozen v0.4 GDELT discovery artifact
        uses: actions/download-artifact@v4
        with:
          name: gdelt-discovery-pilot-v0.4
          path: discovery-pilot
          github-token: ${{ github.token }}
          repository: Ferdows-Ahmadi/trading-llm
          run-id: 34499882298

      - name: Seed v0.3 from Wayback v0.2 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: wayback-capture-index-v0.2
          path: wayback-capture-index
          github-token: ${{ github.token }}
          repository: Ferdows-Ahmadi/trading-llm
          run-id: 34526244847

      - name: Verify frozen inputs and remove holdout
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = "c05cbfa404804789faec779877c839b6655abc317217f182a673b2e91bd9f9a7"
          development = Path("benchmark/development.csv")
          actual = hashlib.sha256(development.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"development benchmark hash mismatch: {actual}")
          for path in Path("benchmark").glob("holdout*"):
              path.unlink()

          discovery = json.loads(Path("discovery-pilot/discovery-summary.json").read_text())
          if discovery.get("pilot_questions") != 20:
              raise SystemExit("unexpected discovery pilot size")
          if int(discovery.get("questions_with_results", 0)) != 12:
              raise SystemExit(f"unexpected GDELT v0.4 coverage: {discovery}")
          if int(discovery.get("articles_found", discovery.get("total_articles", 111))) != 111:
              # Older artifacts did not standardize the summary key; the JSONL is counted below.
              pass

          total_articles = 0
          for line in Path("discovery-pilot/discovery.jsonl").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              item = json.loads(line)
              articles = item.get("articles", [])
              if isinstance(articles, list):
                  total_articles += len({str(a.get("url") or "").strip() for a in articles if isinstance(a, dict) and str(a.get("url") or "").strip()})
          if total_articles != 111:
              raise SystemExit(f"frozen GDELT URL count changed: {total_articles}")

          seed = json.loads(Path("wayback-capture-index/capture-summary.json").read_text())
          if seed.get("urls_considered") != 30 or seed.get("captures_found") != 29:
              raise SystemExit(f"unexpected Wayback v0.2 seed summary: {seed}")

          print("development benchmark sha256:", actual)
          print("holdout files removed before Wayback lookup")
          print("frozen unique GDELT article URLs:", total_articles)
          print("v0.2 URLs seeded:", seed["urls_considered"])
          print("v0.2 captures seeded:", seed["captures_found"])
          PY

      - name: Sweep all frozen exact pre-cutoff Wayback URLs
        run: |
          timeout 28m prediction-lab-wayback-capture-index \
            benchmark/development.csv \
            benchmark/development.manifest.json \
            discovery-pilot/discovery.jsonl \
            wayback-capture-index \
            --pilot-size 20 \
            --max-urls-per-question 1000 \
            --retries 3 \
            --timeout-seconds 30 \
            --retry-backoff-seconds 3 \
            --minimum-interval-seconds 3 \
            --result-limit 1000

      - name: Print Wayback v0.3 audit
        if: always()
        run: |
          if [ -f wayback-capture-index/capture-summary.json ]; then
            cat wayback-capture-index/capture-summary.json
            echo "--- Wayback capture audit ---"
            cat wayback-capture-index/capture-audit.csv
          else
            echo "Wayback sweep did not reach final summary. Preserving partial checkpoints."
            find wayback-capture-index/checkpoints -type f -name '*.json' 2>/dev/null | wc -l
          fi

      - name: Upload Wayback v0.3 capture-index artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-capture-index-v0.3
          path: wayback-capture-index/
          if-no-files-found: error
          retention-days: 14
