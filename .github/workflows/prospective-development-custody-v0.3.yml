name: Prospective Clustered Development Custody v0.3

on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/prospective-development-custody-v0.3.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL_COMMIT: a4de3487a3c931b9e04578b7a501aabb6050e0cc

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install Prediction Lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Verify frozen v0.3 contract before live query
        run: |
          test "$GITHUB_REF_NAME" = "research/prediction-market-lab-v0.1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PROTOCOL_COMMIT" "$GITHUB_SHA"
          python - <<'PY'
          import os
          from prediction_lab import prospective_polymarket_custody_v03 as v03

          assert v03.PROTOCOL_COMMIT == os.environ["PROTOCOL_COMMIT"]
          assert v03.PURPOSE == "prospective-development-custody-v0.3"
          assert v03.TARGET_COHORT == 80
          assert v03.MAX_PER_EVENT == 2
          assert v03.MARKET_FLOOR == 60
          assert v03.EVENT_CLUSTER_FLOOR == 40
          assert str(v03.MIN_HORIZON) == "7 days 00:00:00"
          assert str(v03.MAX_HORIZON) == "90 days 00:00:00"
          PY
          pytest -q packages/prediction-lab/tests/test_prospective_polymarket_custody_v03.py
          ruff check \
            packages/prediction-lab/src/prediction_lab/prospective_polymarket_custody_v03.py \
            packages/prediction-lab/tests/test_prospective_polymarket_custody_v03.py

      - name: Acquire and freeze one-time clustered v0.3 custody
        run: |
          python -m prediction_lab.prospective_polymarket_custody_v03 \
            "$RUNNER_TEMP/prospective-development-custody-v0.3" \
            --code-commit "$GITHUB_SHA"

      - name: Verify clustered custody accounting without semantic inspection
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "prospective-development-custody-v0.3"
          summary = json.loads((root / "custody-summary.json").read_text())
          rows = [
              json.loads(line)
              for line in (root / "cohort.jsonl").read_text().splitlines()
              if line.strip()
          ]
          ledger = [
              json.loads(line)
              for line in (root / "selection-ledger.jsonl").read_text().splitlines()
              if line.strip()
          ]

          event_counts = Counter(str(row["event_id"]) for row in rows)
          rank_counts = Counter(int(row["within_event_rank"]) for row in rows)
          assert summary["purpose"] == "prospective-development-custody-v0.3"
          assert summary["protocol_commit"] == os.environ["PROTOCOL_COMMIT"]
          assert summary["code_commit"] == os.environ["GITHUB_SHA"]
          assert summary["target_cohort"] == 80
          assert summary["max_per_event"] == 2
          assert summary["market_floor"] == 60
          assert summary["event_cluster_floor"] == 40
          assert summary["selected_rows"] == len(rows)
          assert summary["selected_event_groups"] == len(event_counts)
          assert summary["selected_rows"] <= 80
          assert all(size <= 2 for size in event_counts.values())
          assert set(rank_counts).issubset({1, 2})
          assert len({row["market_id"] for row in rows}) == len(rows)
          assert len(ledger) == summary["universe_rows"]
          assert summary["development_forecaster_authorized"] == (
              len(rows) >= 60 and len(event_counts) >= 40
          )
          assert summary["confirmatory_edge_claim_authorized"] is False
          assert summary["forecaster_run"] is False
          assert summary["model_score_computed"] is False
          assert summary["reserved_holdout_accessed"] is False

          print("selected_rows:", summary["selected_rows"])
          print("selected_event_groups:", summary["selected_event_groups"])
          print("development_forecaster_authorized:", summary["development_forecaster_authorized"])
          print("confirmatory_edge_claim_authorized:", summary["confirmatory_edge_claim_authorized"])
          print("gamma_pages:", summary["gamma_pages"])
          print("universe_rows:", summary["universe_rows"])
          print("structurally_eligible_markets:", summary["structurally_eligible_markets"])
          print("structurally_eligible_event_groups:", summary["structurally_eligible_event_groups"])
          print("event_candidates:", summary["event_candidates"])
          print("candidate_event_groups:", summary["candidate_event_groups"])
          print("clob_valid_candidates:", summary["clob_valid_candidates"])
          print("clob_transport_failures:", summary["clob_transport_failures"])
          print("clob_rejection_reason_counts:", summary["clob_rejection_reason_counts"])
          print("selected_within_event_rank_counts:", summary["selected_within_event_rank_counts"])
          print("selected_event_cluster_size_counts:", summary["selected_event_cluster_size_counts"])
          print("cohort_sha256:", summary["cohort_sha256"])
          print("universe_sha256:", summary["universe_sha256"])
          PY

      - name: Upload immutable prospective v0.3 custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospective-development-custody-v0.3
          path: ${{ runner.temp }}/prospective-development-custody-v0.3/
          if-no-files-found: error
          retention-days: 90
