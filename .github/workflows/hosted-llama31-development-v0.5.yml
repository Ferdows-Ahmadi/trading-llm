name: Hosted Llama 3.1 8B Market Residual v0.5

on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/hosted-llama31-development-v0.5.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  llama31-market-residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install prediction lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Verify preregistered residual experiment contract
        run: |
          test "$(git branch --show-current)" = "research/prediction-market-lab-v0.1"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pytest -q \
            packages/prediction-lab/tests/test_ollama_adapter.py \
            packages/prediction-lab/tests/test_local_development_cli.py \
            packages/prediction-lab/tests/test_residual_adapter.py \
            packages/prediction-lab/tests/test_residual_development_cli.py
          ruff check \
            packages/prediction-lab/src/prediction_lab/ollama_adapter.py \
            packages/prediction-lab/src/prediction_lab/local_development_cli.py \
            packages/prediction-lab/src/prediction_lab/residual_adapter.py \
            packages/prediction-lab/src/prediction_lab/residual_development_cli.py \
            packages/prediction-lab/tests/test_residual_adapter.py \
            packages/prediction-lab/tests/test_residual_development_cli.py
          test -f docs/experiments/market-residual-v1-preregistration.md
          test "$(git rev-list --all -- docs/experiments/market-residual-v1-preregistration.md | tail -1)" = \
            "271a0866d1c2ebd4ffa70275f7d187e776fcdc75"
          gh auth status

      - name: Install and start local Ollama runtime
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$RUNNER_TEMP/llama-runtime"
          ollama --version | tee "$RUNNER_TEMP/llama-runtime/ollama-version.txt"
          sha256sum "$(command -v ollama)" | tee "$RUNNER_TEMP/llama-runtime/ollama-binary-sha256.txt"
          uname -a | tee "$RUNNER_TEMP/llama-runtime/host.txt"
          python --version 2>&1 | tee "$RUNNER_TEMP/llama-runtime/python-version.txt"
          ollama serve > "$RUNNER_TEMP/llama-runtime/ollama-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/llama-runtime/ollama-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become ready" >&2
          cat "$RUNNER_TEMP/llama-runtime/ollama-server.log" >&2 || true
          exit 1

      - name: Freeze and verify exact Llama 3.1 8B artifact
        run: |
          ollama pull llama3.1:8b
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags \
            | tee "$RUNNER_TEMP/llama-runtime/ollama-tags-after-pull.json"
          python - "$RUNNER_TEMP/llama-runtime/ollama-tags-after-pull.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = "46e0c10c039e019119339687c3c1757cc81b9da49709a3b3924863ba87ca666e"
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          models = value.get("models")
          if not isinstance(models, list):
              raise SystemExit("Ollama tag listing missing models")
          match = next(
              (
                  item
                  for item in models
                  if isinstance(item, dict)
                  and item.get("name") == "llama3.1:8b"
              ),
              None,
          )
          if match is None:
              raise SystemExit("llama3.1:8b missing after pull")
          actual = match.get("digest")
          if actual != expected:
              raise SystemExit(
                  f"Llama artifact digest changed: actual={actual!r}, expected={expected!r}"
              )
          print(f"Verified frozen model digest: sha256:{actual}")
          PY
          ollama show llama3.1:8b --modelfile \
            > "$RUNNER_TEMP/llama-runtime/llama31-modelfile.txt"
          ollama list | tee "$RUNNER_TEMP/llama-runtime/ollama-list.txt"

      - name: Run preregistered market-residual development experiment
        run: |
          python -m prediction_lab.residual_development_cli \
            --repository-root . \
            --work-root "$RUNNER_TEMP/llama31-residual" \
            --ollama-model llama3.1:8b \
            --ollama-base-url http://127.0.0.1:11434 \
            --ollama-timeout-seconds 1200 \
            --evidence-spec docs/experiments/evidence-relevance-v2-canonical.json

      - name: Require exact residual lineage and complete coverage
        run: |
          SUMMARY="$(find "$RUNNER_TEMP/llama31-residual" -name local-development-summary.json -type f -print -quit)"
          test -n "$SUMMARY"
          DECISIONS="$(dirname "$SUMMARY")/residual-decisions.json"
          test -f "$DECISIONS"
          python - "$SUMMARY" "$DECISIONS" <<'PY'
          import json
          import math
          import os
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          decisions = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if summary.get("experiment") != "llama31-8b-market-residual-v1":
              raise SystemExit("unexpected experiment identity")
          if summary.get("dataset_role") != "development-only":
              raise SystemExit("unexpected dataset role")
          if summary.get("holdout_accessed") is not False:
              raise SystemExit("holdout access flag changed")
          if summary.get("code_commit") != os.environ["GITHUB_SHA"]:
              raise SystemExit("experiment code commit differs from workflow head")
          if summary.get("preregistration_commit") != "271a0866d1c2ebd4ffa70275f7d187e776fcdc75":
              raise SystemExit("residual preregistration identity changed")
          if summary.get("prompt_versions") != {
              "blind": "research-v0",
              "market-aware": "market-residual-v1",
          }:
              raise SystemExit("prompt-version contract changed")
          expected_model = (
              "sha256:46e0c10c039e019119339687c3c1757cc81b9da49709a3b3924863ba87ca666e"
          )
          if summary.get("model_immutable_version") != expected_model:
              raise SystemExit("exact model digest changed")
          expected_mapping = {
              "mapping_version": "logit-residual-v1",
              "max_abs_logit_delta": 0.75,
              "strength_to_abs_logit_delta": {
                  "weak": 0.25,
                  "moderate": 0.5,
                  "strong": 0.75,
              },
              "zero_evidence_policy": "hard-noop-without-model-call",
          }
          if summary.get("residual_mapping") != expected_mapping:
              raise SystemExit("residual mapping changed")
          if summary.get("residual_decision_counts") != {
              "total": 20,
              "hard_noop": 16,
              "model_evaluated": 4,
          }:
              raise SystemExit("residual decision counts changed")

          inputs = summary.get("inputs")
          if not isinstance(inputs, dict):
              raise SystemExit("input lineage missing")
          evidence = inputs.get("filtered_evidence")
          if not isinstance(evidence, dict):
              raise SystemExit("filtered evidence lineage missing")
          if evidence.get("filtered_fixture_sha256") != (
              "cfafa8c780c7067c656a5c8474f172f46239f12e10f1632cd22256f2430a3035"
          ):
              raise SystemExit("relevance-v2 fixture changed")
          if evidence.get("workflow_run") != 34689232387:
              raise SystemExit("relevance-v2 workflow lineage changed")

          modes = summary.get("modes")
          if not isinstance(modes, dict) or set(modes) != {"blind", "market-aware"}:
              raise SystemExit("both modes were not persisted")
          for mode in ("blind", "market-aware"):
              execution = modes[mode].get("execution")
              if not isinstance(execution, dict):
                  raise SystemExit(f"{mode} execution summary missing")
              expected_execution = {
                  "total_questions": 20,
                  "successful_forecasts": 20,
                  "failed_forecasts": 0,
                  "forecast_coverage": 1.0,
              }
              for key, expected_value in expected_execution.items():
                  if execution.get(key) != expected_value:
                      raise SystemExit(
                          f"{mode} coverage gate failed: {key}={execution.get(key)!r}"
                      )

          if not isinstance(decisions, dict) or len(decisions) != 20:
              raise SystemExit("residual decision ledger must contain 20 questions")
          hard_noops = 0
          model_calls = 0
          strength_delta = {"weak": 0.25, "moderate": 0.5, "strong": 0.75}
          for question_id, record in decisions.items():
              if not isinstance(question_id, str) or not isinstance(record, dict):
                  raise SystemExit("malformed residual decision record")
              market = record.get("market_probability")
              final = record.get("final_probability")
              delta = record.get("logit_delta")
              if not isinstance(market, (int, float)) or not isinstance(final, (int, float)):
                  raise SystemExit("residual probabilities are malformed")
              if not isinstance(delta, (int, float)) or abs(float(delta)) > 0.75:
                  raise SystemExit("residual delta violates preregistered bound")
              if record.get("hard_noop") is True:
                  hard_noops += 1
                  if record.get("action") != "hard_noop" or record.get("evidence_strength") != "none":
                      raise SystemExit("hard no-op metadata changed")
                  if float(delta) != 0.0 or float(final) != float(market):
                      raise SystemExit("zero-evidence hard no-op moved the market prior")
                  if record.get("raw_model_output") is not None:
                      raise SystemExit("zero-evidence case unexpectedly called the model")
                  continue
              model_calls += 1
              action = record.get("action")
              strength = record.get("evidence_strength")
              if action == "abstain":
                  expected_delta = 0.0
                  if strength != "none":
                      raise SystemExit("abstention strength changed")
              elif action in {"increase", "decrease"} and strength in strength_delta:
                  magnitude = strength_delta[strength]
                  expected_delta = magnitude if action == "increase" else -magnitude
              else:
                  raise SystemExit("invalid evidence-bearing residual decision")
              if float(delta) != expected_delta:
                  raise SystemExit("residual decision does not match fixed mapping")
              if record.get("raw_model_output") is None:
                  raise SystemExit("evidence-bearing decision lacks raw model output")
              if float(market) in {0.0, 1.0} or expected_delta == 0.0:
                  expected_final = float(market)
              else:
                  logit = math.log(float(market) / (1.0 - float(market)))
                  expected_final = 1.0 / (1.0 + math.exp(-(logit + expected_delta)))
              if not math.isclose(float(final), expected_final, rel_tol=0.0, abs_tol=1e-15):
                  raise SystemExit("persisted final probability does not reproduce from residual")
          if hard_noops != 16 or model_calls != 4:
              raise SystemExit("relevance-v2 residual call split changed")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          test -z "$(git status --porcelain)"

      - name: Upload market-residual development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama31-8b-market-residual-v0.5
          path: |
            ${{ runner.temp }}/llama31-residual/
            ${{ runner.temp }}/llama-runtime/
          if-no-files-found: warn
          retention-days: 30
