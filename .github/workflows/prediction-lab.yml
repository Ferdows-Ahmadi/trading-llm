name: Prediction Lab CI

on:
  push:
    paths:
      - "packages/prediction-lab/**"
      - ".github/workflows/prediction-lab.yml"
  pull_request:
    paths:
      - "packages/prediction-lab/**"
      - ".github/workflows/prediction-lab.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install prediction lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Run tests
        working-directory: packages/prediction-lab
        run: pytest -q

      - name: Run Ruff
        working-directory: packages/prediction-lab
        run: ruff check src tests
