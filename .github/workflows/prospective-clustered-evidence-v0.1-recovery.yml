name: Prospective Clustered Evidence v0.1 Recovery

on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/prospective-clustered-evidence-v0.1-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CUSTODY_ARTIFACT_ID: "10323747083"
  CUSTODY_ARCHIVE_SHA256: "01eebf244add1ff21ee8d21257a000c5ee9588f751ae456e7fc7d17c0704a6aa"
  RECOVERY_AMENDMENT_COMMIT: "08427a2b96ae62bc3549e651f98c0514c62bcfa5"
  SEED_ARTIFACT_ID: "10326569219"
  SEED_ARTIFACT_SHA256: "c5a634563cbd2fddb5624750b17122edb7e1d2557b0f2a6780f8329f29540268"
  SHARD_COUNT: "4"

jobs:
  recover:
    name: recover-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install Prediction Lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Verify frozen recovery contract
        run: |
          test "$GITHUB_REF_NAME" = "research/prediction-market-lab-v0.1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RECOVERY_AMENDMENT_COMMIT" "$GITHUB_SHA"
          python - <<'PY'
          import os
          from prediction_lab import prospective_evidence_recovery_v01 as recovery

          assert recovery.RECOVERY_AMENDMENT_COMMIT == os.environ["RECOVERY_AMENDMENT_COMMIT"]
          assert recovery.SEED_ARTIFACT_ID == int(os.environ["SEED_ARTIFACT_ID"])
          assert recovery.SEED_ARTIFACT_SHA256 == os.environ["SEED_ARTIFACT_SHA256"]
          assert recovery.DEFAULT_SHARD_COUNT == int(os.environ["SHARD_COUNT"])
          PY
          pytest -q \
            packages/prediction-lab/tests/test_prospective_evidence_v01.py \
            packages/prediction-lab/tests/test_prospective_evidence_recovery_v01.py
          ruff check \
            packages/prediction-lab/src/prediction_lab/prospective_evidence_v01.py \
            packages/prediction-lab/src/prediction_lab/prospective_evidence_recovery_v01.py \
            packages/prediction-lab/tests/test_prospective_evidence_recovery_v01.py

      - name: Download immutable custody and seed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$CUSTODY_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/custody.zip"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SEED_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/seed.zip"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          custody = hashlib.sha256((root / "custody.zip").read_bytes()).hexdigest()
          seed = hashlib.sha256((root / "seed.zip").read_bytes()).hexdigest()
          assert custody == os.environ["CUSTODY_ARCHIVE_SHA256"], custody
          assert seed == os.environ["SEED_ARTIFACT_SHA256"], seed
          PY
          mkdir -p "$RUNNER_TEMP/seed"
          unzip -q "$RUNNER_TEMP/seed.zip" -d "$RUNNER_TEMP/seed"
          test "$(find "$RUNNER_TEMP/seed/checkpoints" -maxdepth 1 -name '*.json' | wc -l)" -eq 33

      - name: Recover deterministic evidence shard
        run: |
          python -m prediction_lab.prospective_evidence_recovery_v01 shard \
            "$RUNNER_TEMP/custody.zip" \
            "$RUNNER_TEMP/seed" \
            "$RUNNER_TEMP/recovery-shard-${{ matrix.shard }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "$SHARD_COUNT" \
            --code-commit "$GITHUB_SHA" \
            --gdelt-minimum-interval-seconds 20

      - name: Upload shard checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-clustered-evidence-v0.1-recovery-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/recovery-shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 90

  merge:
    name: merge-recovery
    if: always()
    needs: recover
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install Prediction Lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Download immutable custody and seed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$CUSTODY_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/custody.zip"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SEED_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/seed.zip"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          custody = hashlib.sha256((root / "custody.zip").read_bytes()).hexdigest()
          seed = hashlib.sha256((root / "seed.zip").read_bytes()).hexdigest()
          assert custody == os.environ["CUSTODY_ARCHIVE_SHA256"], custody
          assert seed == os.environ["SEED_ARTIFACT_SHA256"], seed
          PY
          mkdir -p "$RUNNER_TEMP/seed"
          unzip -q "$RUNNER_TEMP/seed.zip" -d "$RUNNER_TEMP/seed"

      - name: Download recovery shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prospective-clustered-evidence-v0.1-recovery-shard-*
          path: ${{ runner.temp }}/shards

      - name: Merge and finalize only if all rows are terminal
        run: |
          python -m prediction_lab.prospective_evidence_recovery_v01 merge \
            "$RUNNER_TEMP/custody.zip" \
            "$RUNNER_TEMP/seed" \
            "$RUNNER_TEMP/shards" \
            "$RUNNER_TEMP/prospective-clustered-evidence-v0.1-recovered" \
            --code-commit "$GITHUB_SHA"

      - name: Verify canonical recovered evidence accounting
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "prospective-clustered-evidence-v0.1-recovered"
          summary = json.loads((root / "evidence-summary.json").read_text())
          assert summary["rows"] == 77
          assert summary["event_groups"] == 53
          assert sum(summary["status_counts"].values()) == 77
          assert set(summary["status_counts"]).issubset(
              {"verified_complete", "verified_empty"}
          )
          assert summary["forecast_ready"] is True
          assert summary["attempted_this_run"] == 0
          assert summary["reused_verified_checkpoints"] == 77
          assert summary["reserved_holdout_accessed"] is False
          assert summary["model_forecast_run"] is False
          assert summary["outcomes_accessed"] is False
          print("status_counts:", summary["status_counts"])
          print("questions_with_evidence:", summary["questions_with_evidence"])
          print("questions_without_evidence:", summary["questions_without_evidence"])
          print("total_evidence_items:", summary["total_evidence_items"])
          print("evidence_fixture_sha256:", summary["evidence_fixture_sha256"])
          print("evidence_packets_sha256:", summary["evidence_packets_sha256"])
          print("evidence_audit_sha256:", summary["evidence_audit_sha256"])
          PY

      - name: Upload recovered evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-clustered-evidence-v0.1-recovered
          path: ${{ runner.temp }}/prospective-clustered-evidence-v0.1-recovered/
          if-no-files-found: warn
          retention-days: 90
