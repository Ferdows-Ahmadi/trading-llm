name: Market Strategy Lab CI

on:
  pull_request:
    paths:
      - "packages/strategy-lab/**"
      - "docs/market-strategy-lab/**"
      - "docs/COLLABORATOR_ONBOARDING.md"
      - ".github/workflows/strategy-lab.yml"
  push:
    branches:
      - "research/market-strategy-lab-v0.1"
    paths:
      - "packages/strategy-lab/**"
      - "docs/market-strategy-lab/**"
      - "docs/COLLABORATOR_ONBOARDING.md"
      - ".github/workflows/strategy-lab.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/strategy-lab/pyproject.toml

      - name: Install
        run: python -m pip install -e "packages/strategy-lab[dev]"

      - name: Tests
        run: pytest packages/strategy-lab/tests -q

      - name: Ruff
        run: ruff check packages/strategy-lab

      - name: Mypy
        run: mypy packages/strategy-lab/src
