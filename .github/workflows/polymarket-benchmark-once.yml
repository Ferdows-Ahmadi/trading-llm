name: First Polymarket Benchmark

on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/polymarket-benchmark-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install prediction lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Fetch and freeze public Polymarket benchmark
        run: |
          prediction-lab-fetch-polymarket \
            --max-questions 340 \
            --candidate-multiplier 4 \
            --minimum-lead 7D \
            --maximum-price-staleness 3D \
            --minimum-volume 100 \
            --holdout-fraction 0.25 \
            --max-market-pages 12 \
            --output-dir data/prediction-lab/polymarket-public-v0.1

      - name: Evaluate deterministic baselines
        run: |
          prediction-lab-baselines \
            data/prediction-lab/polymarket-public-v0.1/development.csv \
            data/prediction-lab/polymarket-public-v0.1/development.manifest.json \
            data/prediction-lab/polymarket-public-v0.1/holdout.csv \
            data/prediction-lab/polymarket-public-v0.1/holdout.manifest.json \
            --output data/prediction-lab/polymarket-public-v0.1/baselines.json

      - name: Print benchmark result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/prediction-lab/polymarket-public-v0.1")
          summary = json.loads((root / "acquisition-summary.json").read_text())
          baselines = json.loads((root / "baselines.json").read_text())

          print("=== CLEAN BENCHMARK ===")
          print("candidate_markets:", summary["acquisition"]["candidate_markets"])
          print("attempted_markets:", summary["acquisition"]["attempted_markets"])
          print("usable_before_split:", summary["acquisition"]["usable_cases"])
          print("development:", summary["development_rows"])
          print("holdout:", summary["holdout_rows"])
          print("raw_holdout_before_event_purge:", summary["raw_holdout_rows_before_event_purge"])
          print("purged_holdout_rows:", summary["purged_holdout_rows"])
          print("purged_event_groups:", summary["purged_event_groups"])
          print("event_overlap_after_purge:", summary["event_overlap_after_purge"])
          print("development_event_groups:", summary["development_event_groups"])
          print("holdout_event_groups:", summary["holdout_event_groups"])
          print("max_snapshot_staleness_hours:", summary["max_snapshot_staleness_hours"])
          print("holdout_start:", summary["holdout_start"])
          print("=== HOLDOUT BASELINES ===")
          for name, report in baselines["reports"].items():
              print(
                  name,
                  "brier=", report["model_brier"],
                  "market_brier=", report["market_brier"],
                  "delta=", report["brier_delta"],
                  "skill=", report["model_skill_vs_market"],
              )
          PY

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-public-benchmark-v0.1-clean
          path: data/prediction-lab/polymarket-public-v0.1/
          if-no-files-found: error
          retention-days: 14
