name: First Polymarket Benchmark

on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/polymarket-benchmark-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install httpx pandas

      - name: Probe Polymarket public history
        run: |
          python - <<'PY'
          import json
          import httpx
          import pandas as pd

          gamma = "https://gamma-api.polymarket.com"
          data = "https://data-api.polymarket.com"

          with httpx.Client(timeout=30.0) as client:
              response = client.get(
                  f"{gamma}/markets/keyset",
                  params={
                      "limit": 100,
                      "closed": "true",
                      "order": "endDate",
                      "ascending": "false",
                  },
              )
              print("markets HTTP:", response.status_code)
              response.raise_for_status()
              payload = response.json()
              markets = payload.get("markets", [])
              print("markets returned:", len(markets))
              print("next_cursor present:", bool(payload.get("next_cursor")))

              long_markets = []
              resolved_binary = []
              for market in markets:
                  start_value = market.get("startDate") or market.get("createdAt")
                  end_value = market.get("endDate")
                  if not start_value or not end_value:
                      continue
                  start = pd.Timestamp(start_value)
                  end = pd.Timestamp(end_value)
                  duration_days = (end - start).total_seconds() / 86400.0
                  if duration_days < 7:
                      continue
                  long_markets.append((duration_days, market))

                  try:
                      outcomes = json.loads(market.get("outcomes") or "[]")
                      prices = [float(value) for value in json.loads(market.get("outcomePrices") or "[]")]
                  except (TypeError, ValueError, json.JSONDecodeError):
                      continue
                  names = [str(value).strip().lower() for value in outcomes]
                  if len(names) != 2 or set(names) != {"yes", "no"} or len(prices) != 2:
                      continue
                  yes_index = names.index("yes")
                  no_index = names.index("no")
                  if (
                      (prices[yes_index] >= 0.99 and prices[no_index] <= 0.01)
                      or (prices[yes_index] <= 0.01 and prices[no_index] >= 0.99)
                  ):
                      resolved_binary.append((duration_days, market))

              print("long >=7d:", len(long_markets))
              print("resolved binary long >=7d:", len(resolved_binary))
              if long_markets:
                  durations = [item[0] for item in long_markets]
                  print(
                      "long duration min/median/max:",
                      min(durations),
                      pd.Series(durations).median(),
                      max(durations),
                  )

              if not resolved_binary:
                  raise RuntimeError("No resolved binary long-duration market found in probe page")

              _, sample = resolved_binary[0]
              target = pd.Timestamp(sample["endDate"]) - pd.Timedelta(days=7)
              condition_id = sample["conditionId"]
              trade_response = client.get(
                  f"{data}/trades",
                  params={
                      "market": condition_id,
                      "end": int(target.timestamp()),
                      "limit": 1000,
                      "takerOnly": "true",
                  },
              )
              print("sample id:", sample.get("id"))
              print("sample question:", sample.get("question"))
              print("sample start/end:", sample.get("startDate"), sample.get("endDate"))
              print("sample conditionId:", condition_id)
              print("target:", target.isoformat())
              print("trades HTTP:", trade_response.status_code)
              trade_response.raise_for_status()
              trades = trade_response.json()
              print("trades returned:", len(trades) if isinstance(trades, list) else "not-list")
              if isinstance(trades, list) and trades:
                  eligible = [t for t in trades if int(t.get("timestamp", 0)) <= int(target.timestamp())]
                  print("eligible trades:", len(eligible))
                  latest = max(eligible, key=lambda trade: int(trade["timestamp"])) if eligible else None
                  if latest:
                      safe = {
                          key: latest.get(key)
                          for key in (
                              "conditionId",
                              "asset",
                              "price",
                              "timestamp",
                              "outcome",
                              "outcomeIndex",
                              "side",
                          )
                      }
                      print("latest eligible trade:", safe)
          PY
