name: First Kalshi Benchmark

on:
  push:
    branches:
      - research/prediction-market-lab-v0.1
    paths:
      - .github/workflows/kalshi-benchmark-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/prediction-lab/pyproject.toml

      - name: Install prediction lab
        run: python -m pip install -e "./packages/prediction-lab[dev]"

      - name: Diagnose real Kalshi history shape
        run: |
          python - <<'PY'
          import httpx
          import pandas as pd

          base = "https://external-api.kalshi.com/trade-api/v2"
          with httpx.Client(timeout=30.0) as client:
              cutoffs = client.get(f"{base}/historical/cutoff").json()
              recent = client.get(
                  f"{base}/markets",
                  params={"status": "settled", "limit": 1000, "mve_filter": "exclude"},
              ).json().get("markets", [])
              historical = client.get(
                  f"{base}/historical/markets",
                  params={"limit": 1000, "mve_filter": "exclude"},
              ).json().get("markets", [])

              def usable(market):
                  try:
                      volume = float(market.get("volume_fp", market.get("volume", 0)) or 0)
                  except (TypeError, ValueError):
                      volume = 0.0
                  return (
                      market.get("ticker")
                      and market.get("title")
                      and str(market.get("market_type", "binary")).lower() == "binary"
                      and str(market.get("result", "")).lower() in {"yes", "no"}
                      and market.get("close_time")
                      and volume >= 100
                      and not bool(market.get("is_provisional", False))
                  )

              recent_usable = [m for m in recent if usable(m)]
              historical_usable = [m for m in historical if usable(m)]
              print("cutoffs:", cutoffs)
              print("recent raw/usable:", len(recent), len(recent_usable))
              print("historical raw/usable:", len(historical), len(historical_usable))

              def duration_days(market):
                  if not market.get("open_time") or not market.get("close_time"):
                      return None
                  return (
                      pd.Timestamp(market["close_time"]) - pd.Timestamp(market["open_time"])
                  ).total_seconds() / 86400.0

              recent_durations = [duration_days(m) for m in recent_usable]
              recent_durations = [d for d in recent_durations if d is not None]
              historical_durations = [duration_days(m) for m in historical_usable]
              historical_durations = [d for d in historical_durations if d is not None]
              if recent_durations:
                  print(
                      "recent duration days min/median/max:",
                      min(recent_durations),
                      pd.Series(recent_durations).median(),
                      max(recent_durations),
                  )
                  print("recent markets open >=7d:", sum(d >= 7 for d in recent_durations))
              if historical_durations:
                  print(
                      "historical duration days min/median/max:",
                      min(historical_durations),
                      pd.Series(historical_durations).median(),
                      max(historical_durations),
                  )
                  print("historical markets open >=7d:", sum(d >= 7 for d in historical_durations))

              sample = next(
                  (m for m in historical_usable if (duration_days(m) or 0) >= 8),
                  None,
              )
              if sample:
                  target = pd.Timestamp(sample["close_time"]) - pd.Timedelta(days=7)
                  response = client.get(
                      f"{base}/historical/trades",
                      params={
                          "ticker": sample["ticker"],
                          "max_ts": int(target.timestamp()),
                          "limit": 3,
                      },
                  )
                  print("sample historical ticker:", sample["ticker"])
                  print("sample open/close:", sample.get("open_time"), sample.get("close_time"))
                  print("sample target:", target.isoformat())
                  print("sample trade HTTP:", response.status_code)
                  payload = response.json()
                  print("sample trades returned:", len(payload.get("trades", [])))
                  if payload.get("trades"):
                      print("sample trade keys:", sorted(payload["trades"][0].keys()))
                      print("sample first trade:", payload["trades"][0])
          PY

      - name: Fetch and freeze public Kalshi benchmark
        run: |
          prediction-lab-fetch-kalshi \
            --max-questions 300 \
            --candidate-multiplier 8 \
            --minimum-lead 7D \
            --minimum-volume 100 \
            --holdout-fraction 0.25 \
            --max-market-pages 8 \
            --max-trade-pages 3 \
            --output-dir data/prediction-lab/kalshi-public-v0.1

      - name: Evaluate deterministic baselines
        run: |
          prediction-lab-baselines \
            data/prediction-lab/kalshi-public-v0.1/development.csv \
            data/prediction-lab/kalshi-public-v0.1/development.manifest.json \
            data/prediction-lab/kalshi-public-v0.1/holdout.csv \
            data/prediction-lab/kalshi-public-v0.1/holdout.manifest.json \
            --output data/prediction-lab/kalshi-public-v0.1/baselines.json

      - name: Print benchmark result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/prediction-lab/kalshi-public-v0.1")
          summary = json.loads((root / "acquisition-summary.json").read_text())
          baselines = json.loads((root / "baselines.json").read_text())
          print("=== BENCHMARK SIZE ===")
          print("development:", summary["development_rows"])
          print("holdout:", summary["holdout_rows"])
          print("holdout_start:", summary["holdout_start"])
          print("=== HOLDOUT BASELINES ===")
          for name, report in baselines["reports"].items():
              print(
                  name,
                  "brier=", report["model_brier"],
                  "market_brier=", report["market_brier"],
                  "delta=", report["brier_delta"],
                  "skill=", report["model_skill_vs_market"],
              )
          PY

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-public-benchmark-v0.1
          path: data/prediction-lab/kalshi-public-v0.1/
          if-no-files-found: error
          retention-days: 14
