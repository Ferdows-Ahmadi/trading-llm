[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy-lab"
version = "0.1.0"
description = "Research-grade strategy formalization and replay components for trading-llm"
requires-python = ">=3.12"
dependencies = ["tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.8,<1.0", "mypy>=1.13,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
